[github]
# GitHub personal access token. Keep it empty in committed config files.
# Prefer setting DBGENIE_GITHUB_TOKEN in the local environment.
token = ""
per_page = 50

[dataset]
min_stars = 50
min_forks = 3
min_contributors = 3
min_tables = 3
active_within_days = 365
# Store only selected files needed for schema/evidence/test construction.
# Do not materialize full repositories into the final dataset.
materialization_mode = "selected_files"
max_evidence_files_per_repo = 80
max_file_bytes = 500000
min_application_score = 4
# Contributor count requires an extra API request per repository. Disable it for
# broad candidate collection; final samples will be manually verified.
require_contributors_check = false

# Recommended screening should use multiple focused queries instead of scanning
# all GitHub repositories by stars. Keep thresholds conservative at this stage;
# tune them after measuring acceptance rate on each query family.
