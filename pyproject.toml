[project]
name = "dbgenie"
version = "0.1.0"
description = "DBGenie database-design method and DevDB-Bench tooling."
requires-python = ">=3.10"
dependencies = [
  "duckdb==1.5.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
method = [
  "autogen-agentchat==0.7.5",
  "autogen-ext[openai]==0.7.5",
]
evaluation = [
  "fastembed>=0.8",
  "nltk>=3.9",
  "spacy>=3.7",
]

[project.scripts]
dbgenie = "dbgenie.cli:main"

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["dbgenie*", "benchmark*"]

[tool.setuptools.package-data]
dbgenie = [
  "agents/skills/*.md",
  "agents/dialect_cards/*.md",
  "methods/baselines/few_shot/examples/*.json",
  "methods/baselines/few_shot/examples/*.sql",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
